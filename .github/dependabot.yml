version: 2
updates:
  - package-ecosystem: 'maven'
    directories:
      - '/services/controller'
      - '/services/sut'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      spring-boot:
        patterns:
          - 'org.springframework.boot:*'
      maven-minor-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'npm'
    directory: '/web'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-eslint/*'
      npm-minor-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      root-minor-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - '*'